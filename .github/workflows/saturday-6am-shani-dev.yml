      - name: Start YouTube Live
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          set -e

          if [ -z "$YOUTUBE_STREAM_KEY" ]; then
            echo "ERROR: YouTube Stream Key is missing."
            exit 1
          fi

          echo "Starting YouTube Live..."
          echo "IST time: $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M:%S')"

          ffmpeg \
            -hide_banner \
            -loglevel info \
            -re \
            -stream_loop -1 \
            -i video.mp4 \
            -t 00:10:00 \
            -map 0:v:0 \
            -map 0:a:0 \
            -vf "scale=1280:720:force_original_aspect_ratio:decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,fps=30,format=yuv420p" \
            -c:v libx264 \
            -preset veryfast \
            -profile:v main \
            -level 4.0 \
            -b:v 4500k \
            -maxrate 4500k \
            -bufsize 9000k \
            -r 30 \
            -g 60 \
            -keyint_min 60 \
            -sc_threshold 0 \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -ac 2 \
            -af "aresample=async=1:first_pts=0" \
            -f flv \
            "rtmp://a.rtmp.youtube.com/live2/${YOUTUBE_STREAM_KEY}"
