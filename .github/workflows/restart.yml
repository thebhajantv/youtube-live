name: Auto Restart YouTube Live

on:
  workflow_run:
    workflows:
      - "YouTube Live"
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  restart:
    # केवल failure या timeout पर automatic restart
    # manual cancellation पर restart नहीं होगा
    if: >
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'timed_out'

    runs-on: ubuntu-latest

    steps:
      - name: Wait before restart
        run: sleep 20

      - name: Start new YouTube Live
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/actions/workflows/live.yml/dispatches" \
            -f ref=main

      - name: Confirm restart
        run: echo "New YouTube Live workflow triggered successfully."
