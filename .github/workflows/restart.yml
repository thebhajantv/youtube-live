name: Auto Restart Batches

on:
  workflow_run:
    workflows:
      - "YouTube Live"
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  restart:
    if: github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Find next batch
        id: batch
        run: |
          BATCH="${{ github.event.workflow_run.head_branch }}"

          if [ "$BATCH" = "batch1" ]; then
            echo "next=2" >> "$GITHUB_OUTPUT"
          elif [ "$BATCH" = "batch2" ]; then
            echo "next=3" >> "$GITHUB_OUTPUT"
          else
            echo "next=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Start next batch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run live.yml \
            --ref main \
            -f batch=${{ steps.batch.outputs.next }}
