name: Auto Restart YouTube Live

on:
  workflow_run:
    workflows:
      - "YouTube Live"
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  restart:
    runs-on: ubuntu-latest

    steps:
      - name: Wait before restart
        run: sleep 20

      - name: Start YouTube Live again
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "/repos/${{ github.repository }}/actions/workflows/live.yml/dispatches" \
            -f ref=main

      - name: Restart triggered
        run: echo "New YouTube Live workflow has been started."
