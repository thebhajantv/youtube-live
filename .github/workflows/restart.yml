name: Auto Restart YouTube Live

on:
  workflow_run:
    workflows: ["YouTube Live"]
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  restart:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Wait before restart
        run: sleep 15

      - name: Restart YouTube Live
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run live.yml --ref main
