name: Auto Restart YouTube Live

on:
  workflow_run:
    workflows: ["YouTube Live"]
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  restart:
    runs-on: ubuntu-latest

    steps:
      - name: Wait before restart
        run: sleep 15

      - name: Restart YouTube Live
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST \
            repos/${{ github.repository }}/actions/workflows/live.yml/dispatches \
            -f ref=main
