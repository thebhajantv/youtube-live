name: MANUAL LIVE TEST - Hanuman Beej Mantra - YouTube + Facebook

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 190

    steps:

      - name: Install FFmpeg and Gdown
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y ffmpeg python3-pip
          python3 -m pip install --upgrade gdown
          ffmpeg -version

      - name: Download Hanuman Beej Mantra
        run: |
          gdown "https://drive.google.com/uc?id=1TZALYEg2FCGjPojNG5jr5JW_OShvoWwX" -O video.mp4
          ls -lh video.mp4

      - name: Check Video
        run: |
          ffprobe -v error \
            -show_entries format=duration \
            -of default=noprint_wrappers=1 \
            video.mp4

      - name: Check Stream Keys
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
          FACEBOOK_STREAM_KEY: ${{ secrets.FACEBOOK_STREAM_KEY }}
        run: |
          test -n "$YOUTUBE_STREAM_KEY" || {
            echo "ERROR: YOUTUBE_STREAM_KEY is empty"
            exit 1
          }

          test -n "$FACEBOOK_STREAM_KEY" || {
            echo "ERROR: FACEBOOK_STREAM_KEY is empty"
            exit 1
          }

          echo "YouTube Stream Key: FOUND"
          echo "Facebook Stream Key: FOUND"

      - name: Start YouTube + Facebook Live
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
          FACEBOOK_STREAM_KEY: ${{ secrets.FACEBOOK_STREAM_KEY }}
        run: |
          echo "======================================"
          echo "STARTING YOUTUBE + FACEBOOK LIVE"
          echo "======================================"
          echo "IST: $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M:%S')"

          ffmpeg \
            -hide_banner \
            -loglevel info \
            -re \
            -stream_loop -1 \
            -i video.mp4 \
            -map 0:v:0 \
            -map 0:a:0 \
            -vf "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,fps=30,format=yuv420p" \
            -c:v libx264 \
            -preset veryfast \
            -profile:v main \
            -level 4.0 \
            -pix_fmt yuv420p \
            -b:v 4500k \
            -maxrate 4500k \
            -bufsize 9000k \
            -r 30 \
            -g 60 \
            -keyint_min 60 \
            -sc_threshold 0 \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -ac 2 \
            -af "aresample=async=1:first_pts=0" \
            -flvflags no_duration_filesize \
            -f tee \
            "[f=flv:onfail=ignore]rtmp://a.rtmp.youtube.com/live2/${YOUTUBE_STREAM_KEY}|[f=flv:onfail=ignore]rtmps://live-api.facebook.com:443/rtmp/${FACEBOOK_STREAM_KEY}"
