name: Live Batch 2

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 340

    steps:

      - name: Install dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y ffmpeg
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install gdown
          ffmpeg -version

      - name: Download videos
        run: |
          .venv/bin/gdown "https://drive.google.com/uc?id=1wX8MYiBMVVrVzPPDThMsk4pPL4xFSnNO" -O 05.mp4
          .venv/bin/gdown "https://drive.google.com/uc?id=1aUEdDMoB6tmT8-jPy-bSJfFooWV1Pog0" -O 06.mp4
          .venv/bin/gdown "https://drive.google.com/uc?id=1TZALYEg2FCGjPojNG5jr5JW_OShvoWwX" -O 07.mp4

      - name: Create playlist
        run: |
          printf "file '05.mp4'\nfile '06.mp4'\nfile '07.mp4'\n" > playlist.txt
          cat playlist.txt

      - name: Start YouTube + Facebook Live
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
          FACEBOOK_STREAM_KEY: ${{ secrets.FACEBOOK_STREAM_KEY }}
        run: |
          ffmpeg -hide_banner -loglevel info \
            -re \
            -f concat -safe 0 -i playlist.txt \
            -map 0:v:0 \
            -map 0:a:0 \
            -vf "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,fps=30,format=yuv420p" \
            -c:v libx264 \
            -preset veryfast \
            -profile:v main \
            -level 4.0 \
            -b:v 4500k \
            -maxrate 4500k \
            -bufsize 9000k \
            -r 30 \
            -g 60 \
            -keyint_min 60 \
            -sc_threshold 0 \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -ac 2 \
            -af "aresample=async=1:first_pts=0" \
            -f tee \
            "[f=flv]rtmp://a.rtmp.youtube.com/live2/${YOUTUBE_STREAM_KEY}|[f=flv]rtmps://live-api-s.facebook.com:443/rtmp/${FACEBOOK_STREAM_KEY}"

      - name: Start Batch 3
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run batch3.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main
