name: Live - Om Namah Shivaya Mantra - Monday 5PM

on:
  schedule:
    - cron: '30 11 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 190

    steps:

      - name: Install dependencies
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y ffmpeg
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install gdown
          ffmpeg -version

      - name: Download video
        run: |
          .venv/bin/gdown "https://drive.google.com/uc?id=1DmdhPFhm2Gi5e-CVhuUbq48WI8wEFVbb" -O video.mp4
          ls -lh video.mp4

      - name: Check Stream Keys
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
          FACEBOOK_STREAM_KEY: ${{ secrets.FACEBOOK_STREAM_KEY }}
        run: |
          if [ -z "$YOUTUBE_STREAM_KEY" ]; then
            echo "ERROR: YouTube Stream Key is EMPTY"
            exit 1
          fi

          if [ -z "$FACEBOOK_STREAM_KEY" ]; then
            echo "ERROR: Facebook Stream Key is EMPTY"
            exit 1
          fi

          echo "YouTube Stream Key: FOUND"
          echo "Facebook Stream Key: FOUND"

      - name: Start YouTube + Facebook Live
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
          FACEBOOK_STREAM_KEY: ${{ secrets.FACEBOOK_STREAM_KEY }}
        run: |
          echo "Starting YouTube + Facebook Live..."
          echo "IST time: $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M:%S')"

          ffmpeg \
            -hide_banner \
            -loglevel info \
            -re \
            -stream_loop -1 \
            -i video.mp4 \
            -t 03:00:00 \
            -map 0:v:0 \
            -map 0:a:0 \
            -vf "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,fps=30,format=yuv420p" \
            -c:v libx264 \
            -preset veryfast \
            -profile:v main \
            -level 4.0 \
            -b:v 4500k \
            -maxrate 4500k \
            -bufsize 9000k \
            -r 30 \
            -g 60 \
            -keyint_min 60 \
            -sc_threshold 0 \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -ac 2 \
            -af "aresample=async=1:first_pts=0" \
            -f tee \
            "[f=flv]rtmp://a.rtmp.youtube.com/live2/${YOUTUBE_STREAM_KEY}|[f=flv]rtmps://live-api.facebook.com:443/rtmp/${FACEBOOK_STREAM_KEY}"
